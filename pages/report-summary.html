<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e40af">
  <title>保全レポート — 設備保全アプリ</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <meta http-equiv="refresh" content="0; url=/pages/dashboard?tab=report">
</head>
<body>
  <!-- 保全レポートはダッシュボードの「レポート」タブへ統合した。古いブックマーク・ホーム画面のURL用の移動ページ -->
  <p>保全レポートはダッシュボードの「レポート」タブに移動しました。<a href="/pages/dashboard?tab=report">開く</a></p>
  <!-- 上の <meta http-equiv="refresh"> だけで即時遷移するため、インラインスクリプトは不要
       （CSP の script-src から 'unsafe-inline' を外すため削除） -->
</body>
</html>
